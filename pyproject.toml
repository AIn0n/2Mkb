[project]
name = "tmkb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Szymon Górka", email = "55995692+AIn0n@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "omegaconf>=2.3.1",
    "solidpython2>=2.1.3",
]

[project.scripts]
2mkb = "tmkb:main"
generate = "tmkb.generate:main"

[project.optional-dependencies]
preview = [
    "ipykernel>=7.3.0",
    "jupyterscad>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]
